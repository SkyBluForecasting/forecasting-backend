name: Update Static API Docs

on:
  push:
    branches: [ main ]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install python + node dependencies
        run: |
          pip install fastapi python-dotenv
          npm install -g redoc-cli

      - name: Generate OpenAPI schema + ReDoc HTML
        run: python scripts/generate_docs.py

      - name: Commit and push docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/openapi.json docs/index.html
          git commit -m "Update API docs [auto]" || echo "No changes"
          git push
