name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_forecasting_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Login to AWS CodeArtifact
      id: login
      run: |
        echo "${{ secrets.ENV_FILE_STAGING }}" > .env
        set -a
        source .env
        set +a

        echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
        echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

        TOKEN=$(aws codeartifact get-authorization-token \
          --domain skyblu \
          --domain-owner 591082451778 \
          --region $AWS_REGION \
          --query authorizationToken \
          --output text)

        echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://aws:${CODEARTIFACT_AUTH_TOKEN}@skyblu-591082451778.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/forecasting-db/simple/ \
                    --extra-index-url https://pypi.org/simple \
                    -r requirements.txt

    - name: Check formatting with black
      run: black . --check

    - name: Lint with Flake8 (Black-compatible)
      run: flake8 . --count --ignore=D203,W503,E203 --show-source --statistics --max-line-length=100

    - name: Check imports with isort
      run: isort . --check-only

    # Set a default DATABASE_URL for unit tests
    - name: Set DATABASE_URL for unit tests
      run: echo "DATABASE_URL=sqlite+aiosqlite:///:memory:" >> $GITHUB_ENV

    - name: Run unit tests with coverage
      run: |
        PYTHONPATH=${{ github.workspace }} coverage run --source=app -m pytest --asyncio-mode=auto tests/unit/
        coverage report -m
        coverage xml -o coverage_unit.xml

    - name: Run integration tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_forecasting_db
      run: |
        # Wait for Postgres
        until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
        PYTHONPATH=${{ github.workspace }} pytest --asyncio-mode=auto tests/integration/
