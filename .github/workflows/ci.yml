name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Login to AWS CodeArtifact
      id: login
      run: |
        echo "${{ secrets.ENV_FILE_STAGING }}" > .env
        set -a
        source .env
        set +a

        # Make AWS vars available for next steps
        echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
        echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

        TOKEN=$(aws codeartifact get-authorization-token \
          --domain skyblu \
          --domain-owner 591082451778 \
          --region $AWS_REGION \
          --query authorizationToken \
          --output text)

        echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Set DATABASE_URL for CI
      run: echo "DATABASE_URL=sqlite+aiosqlite:///:memory:" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://aws:${CODEARTIFACT_AUTH_TOKEN}@skyblu-591082451778.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/forecasting-db/simple/ \
                    --extra-index-url https://pypi.org/simple \
                    -r requirements.txt

    - name: Check formatting with black
      run: black . --check  # pyproject.toml will supply line-length

    - name: Lint with Flake8 (Black-compatible)
      run: flake8 . --count --ignore=D203,W503,E203 --show-source --statistics --max-line-length=100

    - name: Check imports with isort
      run: isort . --check-only  # pyproject.toml will supply profile and line-length

    - name: Run tests with coverage (branch coverage)
      run: |
        # Ensure pytest-asyncio is installed
        pip install pytest-asyncio

        # Run tests with coverage and asyncio support
        PYTHONPATH=${{ github.workspace }} coverage run --source=app -m pytest --asyncio-mode=auto tests/
        coverage report -m
        coverage xml

    - name: Check final coverage summary
      run: |
        coverage report --show-missing

    - name: Display coverage summary
      run: coverage report --fail-under=100 --ignore-errors

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14
