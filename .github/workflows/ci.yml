name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check formatting with black
      run: |
        black . --check

    - name: Lint with Flake8 (Black-compatible)
      run: |
        flake8 . --count --ignore=D203 --show-source --statistics --max-line-length=88

    - name: Check imports with isort
      run: |
        isort . --check-only

    - name: Run tests with coverage (branch coverage)
      run: |
        pip install coverage pytest
        PYTHONPATH=${{ github.workspace }} coverage run --source=app -m pytest tests/
        coverage report -m
        coverage xml

    - name: Check final coverage summary
      run: |
        coverage report --show-missing

    - name: Display coverage summary
      run: coverage report --fail-under=100 --ignore-errors

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14
