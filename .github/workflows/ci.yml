name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort pytest pytest-cov

    - name: Check formatting with black
      run: |
        black . --check

    - name: Check imports with isort
      run: |
        isort . --check-only

    - name: Load environment variables from ENV_FILE_STAGING
      run: echo "${{ secrets.ENV_FILE_STAGING }}" > .env

    - name: Run tests
      run: |
        set -a
        source .env
        set +a
        pytest tests/

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Load environment variables from ENV_FILE_STAGING
      run: echo "${{ secrets.ENV_FILE_STAGING }}" > .env

    - name: Run tests with coverage (branch coverage)
      run: |
        set -a
        source .env
        set +a
        pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-branch tests/
        coverage report --fail-under=100

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14
