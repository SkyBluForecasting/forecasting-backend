name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ensure full history
          fetch-tags: true  # fetch tags to ensure the specified tag is available

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Copy .env file to EC2
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" | \
            ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} \
            'cat > ~/forecasting-backend/.env'

      - name: List files before rsync
        run: |
          echo "Current directory: $(pwd)"
          ls -la

      - name: Copy project files to EC2
        run: |
          rsync -avz --delete --exclude='.git' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/app

      - name: SSH into EC2 and restart Docker container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -e
            cd ~/app

            echo "--- CONTENTS OF ~/app ---"
            ls -la

            echo "--- STOPPING old Docker container if it exists ---"
            docker stop forecasting-api || true
            docker rm forecasting-api || true
            docker rmi forecasting-api || true

            echo "--- BUILDING Docker image ---"
            docker build -t forecasting-api .

            echo "--- RUNNING container ---"
            docker run -d \
              --name forecasting-api \
              --env-file .env \
              -p 80:8000 \
              forecasting-api
          EOF
