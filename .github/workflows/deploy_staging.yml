name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Prepare environment and get CodeArtifact token
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" > .env
          set -a
          source .env
          set +a

          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

          TOKEN=$(aws codeartifact get-authorization-token \
            --domain skyblu \
            --domain-owner 591082451778 \
            --region $AWS_REGION \
            --query authorizationToken \
            --output text)
          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Build wheels for all dependencies
        run: |
          mkdir -p wheels
          python -m pip install --upgrade pip wheel setuptools
          pip wheel -r requirements.txt -w wheels \
            --index-url https://aws:${CODEARTIFACT_AUTH_TOKEN}@skyblu-591082451778.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/forecasting-db/simple/ \
            --extra-index-url https://pypi.org/simple

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Test SSH access
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} "echo success"

      - name: Copy source code and wheels to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r . ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-backend/
          scp -o StrictHostKeyChecking=no -r wheels/* ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-backend/wheels/

      - name: Copy cleanup script to EC2 and make executable
        run: |
          scp -o StrictHostKeyChecking=no $GITHUB_WORKSPACE/app/tasks/cleanup.sh ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:/home/ec2-user/cleanup.sh
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} "chmod +x /home/ec2-user/cleanup.sh"

      - name: Install cron on EC2 host
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << EOF
            sudo dnf install -y cronie
            sudo systemctl enable crond
            sudo systemctl start crond
          EOF

      - name: Install cron job for cleanup
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << EOF
            # Check if the cron job already exists
            crontab -l | grep -q '/home/ec2-user/cleanup.sh' || \
              (crontab -l 2>/dev/null; echo "0 2 * * * /home/ec2-user/cleanup.sh >> /home/ec2-user/cleanup.log 2>&1") | crontab -
          EOF

      - name: Build Docker image and restart container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << EOF
            set -euo pipefail

            # Ensure docker starts on reboot
            sudo systemctl enable docker
            sudo systemctl start docker

            cd ~/forecasting-backend

            echo "--- STOPPING OLD CONTAINER (if any) ---"
            docker rm -f forecasting-api 2>/dev/null || true

            echo "--- OPTIONAL: REMOVE OLD IMAGE TAG (if any) ---"
            docker image rm forecasting-api 2>/dev/null || true

            echo "--- BUILDING DOCKER IMAGE ---"
            docker build --no-cache -t forecasting-api . \
              --build-arg CODEARTIFACT_AUTH_TOKEN=${CODEARTIFACT_AUTH_TOKEN}

            echo "--- RUNNING NEW CONTAINER ---"
            docker run -d \
              --name forecasting-api \
              --restart unless-stopped \
              --env-file .env \
              -e DATABASE_URL=${{ secrets.SQLALCHEMY_URL }} \
              -p 80:8000 \
              forecasting-api

            echo "--- CONTAINER STATUS ---"
            docker ps --filter "name=forecasting-api"

            echo "--- LAST 50 LOG LINES ---"
            docker logs --tail 50 forecasting-api || true
          EOF
