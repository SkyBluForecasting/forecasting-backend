name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Prepare .env, login to CodeArtifact, and copy to EC2
        run: |
          set -e

          echo "--- Export staging env vars ---"
          set -a
          echo "${{ secrets.ENV_FILE_STAGING }}" | tee temp.env >/dev/null
          echo "DATABASE_URL=${{ secrets.SQLALCHEMY_URL }}" | tee -a temp.env >/dev/null
          source temp.env
          set +a

          echo "--- AWS environment ---"
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY=<hidden>"
          echo "AWS_REGION=${AWS_REGION}"

          echo "--- Get CodeArtifact token ---"
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain skyblu \
            --domain-owner 591082451778 \
            --region $AWS_REGION \
            --query authorizationToken \
            --output text)
          echo "Token (first 10 chars): ${TOKEN:0:10}"

          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

          echo "--- Check CodeArtifact pip URL ---"
          echo "https://aws:${TOKEN}@skyblu-591082451778.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/forecasting-db/simple/"

          echo "--- Attempt dry-run install on EC2 (debug) ---"
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << EOF
            set -e
            cd ~/forecasting-backend
            echo "Trying pip install --dry-run for debugging..."
            pip install forecasting-db==1.1.0 \
              --index-url https://aws:${TOKEN}@skyblu-591082451778.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/forecasting-db/simple/ \
              --extra-index-url https://pypi.org/simple \
              --dry-run
          EOF

          echo "--- Copy final .env to EC2 ---"
          scp -o StrictHostKeyChecking=no temp.env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-backend/.env
          rm temp.env

      - name: Confirm .env exists on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} \
            'ls -l ~/forecasting-backend/.env && head -n 5 ~/forecasting-backend/.env'

      - name: SSH into EC2 and restart Docker container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << EOF
            set -e
            cd ~/forecasting-backend

            echo "--- CONTENTS OF ~/forecasting-backend ---"
            ls -la

            echo "--- STOPPING old Docker container if it exists ---"
            docker stop forecasting-api || true
            docker rm forecasting-api || true
            docker rmi forecasting-api || true

            echo "--- BUILDING Docker image ---"
            docker build --no-cache \
              --build-arg CODEARTIFACT_AUTH_TOKEN=$CODEARTIFACT_AUTH_TOKEN \
              --build-arg AWS_REGION=$AWS_REGION \
              -t forecasting-api .

            echo "--- RUNNING container ---"
            docker run -d \
              --name forecasting-api \
              --env-file .env \
              -p 80:8000 \
              forecasting-api
          EOF
