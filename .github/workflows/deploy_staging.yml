name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure all tags are fetched

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Copy .env file to EC2
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" | \
            ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} \
            'mkdir -p ~/app && cat > ~/app/.env'

      - name: Rsync project files to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/app/

      - name: Build and run Docker on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -e
            cd ~/app

            echo "Stopping old container if it exists..."
            docker stop forecasting-api || true
            docker rm forecasting-api || true
            docker rmi forecasting-api || true

            echo "Building Docker image..."
            docker build -t forecasting-api .

            echo "Running new container..."
            docker run -d \
              --name forecasting-api \
              --env-file .env \
              -p 80:8000 \
              forecasting-api
          EOF
