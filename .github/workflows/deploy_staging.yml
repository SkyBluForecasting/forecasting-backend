name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      # ---------------- SSH Setup ----------------
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} "echo SSH connection successful"

      # ---------------- Env + CodeArtifact ----------------
      - name: Prepare environment and get CodeArtifact token
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" > .env
          set -a
          source .env
          set +a

          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

          TOKEN=$(aws codeartifact get-authorization-token \
            --domain skyblu \
            --domain-owner 591082451778 \
            --region $AWS_REGION \
            --query authorizationToken \
            --output text)
          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

      # ---------------- Build wheels locally ----------------
      - name: Build wheels for all dependencies
        run: |
          mkdir -p wheels
          python -m pip install --upgrade pip wheel setuptools
          pip wheel -r requirements.txt -w wheels \
            --index-url https://aws:${CODEARTIFACT_AUTH_TOKEN}@skyblu-591082451778.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/forecasting-db/simple/ \
            --extra-index-url https://pypi.org/simple

      # ---------------- Copy artifacts to EC2 ----------------
      - name: Copy .env and wheels to EC2
        run: |
          scp -o StrictHostKeyChecking=no .env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-backend/.env
          scp -o StrictHostKeyChecking=no -r wheels ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-backend/wheels

      # ---------------- SSH into EC2 & deploy ----------------
      - name: SSH into EC2, build Docker image, and restart container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -e
            cd ~/forecasting-backend

            echo "--- STOPPING old Docker container ---"
            docker stop forecasting-api || true
            docker rm forecasting-api || true
            docker rmi forecasting-api || true

            echo "--- BUILDING Docker image using wheels ---"
            docker build --no-cache \
              --build-arg CODEARTIFACT_AUTH_TOKEN=$CODEARTIFACT_AUTH_TOKEN \
              --build-arg AWS_REGION=$AWS_REGION \
              -t forecasting-api .

            echo "--- RUNNING container ---"
            docker run -d \
              --name forecasting-api \
              --env-file .env \
              -p 80:8000 \
              forecasting-api
          EOF
